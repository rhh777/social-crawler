name: 功能建议
description: 提出新功能或改进
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        这是个人维护的项目，不保证接受。范围较大的改动请先在这里讨论，不要直接提 PR。

        不在范围内：绕过平台风控或验证码的算法实现、批量养号、代理池采购与分发、规避实名与限流的手段。

  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
      description: 先说场景和当前的障碍，不要直接给方案
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代办法
      description: 用现有配置、CLI 或文档里的流程能否绕过；为什么不够
