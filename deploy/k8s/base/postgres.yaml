apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  labels:
    app.kubernetes.io/name: social-crawler-postgres
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: social-crawler-postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: social-crawler-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: social-crawler-postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: social-crawler-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: social-crawler-postgres
        app.kubernetes.io/part-of: social-crawler
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgres
          image: postgres:17.4-bookworm
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: crawler
            - name: POSTGRES_USER
              value: crawler
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: social-crawler-secrets
                  key: postgres-password
          readinessProbe:
            exec:
              command: [/usr/bin/pg_isready, -U, crawler, -d, crawler]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            exec:
              command: [/usr/bin/pg_isready, -U, crawler, -d, crawler]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
