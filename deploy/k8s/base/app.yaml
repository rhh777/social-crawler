apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crawler-data
  labels:
    app.kubernetes.io/name: social-crawler
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crawler-profiles
  labels:
    app.kubernetes.io/name: social-crawler
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crawler-artifacts-v2
  labels:
    app.kubernetes.io/name: social-crawler
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: social-crawler
  labels:
    app.kubernetes.io/name: social-crawler
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: social-crawler
  ports:
    - name: web
      port: 8765
      targetPort: web
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: social-crawler
  labels:
    app.kubernetes.io/name: social-crawler
spec:
  serviceName: social-crawler
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: social-crawler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: social-crawler
        app.kubernetes.io/part-of: social-crawler
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: app
          image: social-crawler:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              rm -f /tmp/.X99-lock /tmp/.X11-unix/X99
              Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp &
              while [ ! -S /tmp/.X11-unix/X99 ]; do sleep 0.1; done
              exec social-crawler-web --host 0.0.0.0 --port 8765 --root /app
          ports:
            - name: web
              containerPort: 8765
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: social-crawler-secrets
                  key: postgres-password
            - name: CRAWLER_DATABASE_URL
              value: postgresql+psycopg://crawler:$(POSTGRES_PASSWORD)@postgres:5432/crawler
            - name: CRAWLER_IMAGE_DIGEST
              value: unavailable
            - name: CRAWLER_WEB_HOST
              value: 0.0.0.0
            - name: CRAWLER_WEB_PORT
              value: "8765"
            - name: CRAWLER_WORKERS
              value: "2"
            - name: CRAWLER_DEFAULT_HEADLESS
              value: "true"
            - name: CRAWLER_ARTIFACTS_DIR
              value: /app/artifacts
            - name: CRAWLER_WEB_ALLOWED_HOSTS
              value: localhost,127.0.0.1,social-crawler
            - name: CRAWLER_PROXY_RELAY_HOST
              value: ""
            - name: CRAWLER_PROXY_RELAY_MAP
              value: ""
            - name: DISPLAY
              value: :99
          startupProbe:
            httpGet:
              path: /api/health
              port: web
              httpHeaders:
                - name: Host
                  value: localhost:8765
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: web
              httpHeaders:
                - name: Host
                  value: localhost:8765
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: web
              httpHeaders:
                - name: Host
                  value: localhost:8765
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
          volumeMounts:
            - name: crawler-data
              mountPath: /app/data
            - name: crawler-profiles
              mountPath: /app/profiles
            - name: crawler-artifacts
              mountPath: /app/artifacts
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: crawler-data
          persistentVolumeClaim:
            claimName: crawler-data
        - name: crawler-profiles
          persistentVolumeClaim:
            claimName: crawler-profiles
        - name: crawler-artifacts
          persistentVolumeClaim:
            claimName: crawler-artifacts-v2
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
