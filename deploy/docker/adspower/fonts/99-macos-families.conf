<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The AdsPower profile presents macOS. Pages detect fonts by family name, so a
  Linux font set (Liberation, DejaVu, WenQuanYi, Unifont, ...) contradicts it.
  Rename the installed metric-compatible and CJK fonts to their macOS
  counterparts at scan time and hide Linux-only families. Glyph metrics still
  differ from the real Apple fonts; only name-based detection is covered.
-->
<fontconfig>
  <!-- Hide Linux-only families by file location. -->
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/X11/*</glob>
      <glob>/usr/share/fonts/opentype/ipafont-gothic/*</glob>
      <glob>/usr/share/fonts/opentype/tlwg/*</glob>
      <glob>/usr/share/fonts/opentype/unifont/*</glob>
      <glob>/usr/share/fonts/truetype/fonts-japanese-*</glob>
      <glob>/usr/share/fonts/truetype/freefont/*</glob>
      <glob>/usr/share/fonts/truetype/wqy/*</glob>
      <glob>/usr/share/fonts/truetype/dejavu/*</glob>
      <glob>/usr/share/fonts/truetype/liberation/LiberationSansNarrow-*</glob>
      <pattern><patelt name="family"><string>Noto Sans Mono CJK SC</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Sans Mono CJK TC</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Sans Mono CJK HK</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Sans Mono CJK JP</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Sans Mono CJK KR</string></patelt></pattern>
    </rejectfont>
  </selectfont>

  <!-- Scan-time renames: the original Linux family name disappears. -->
  <match target="scan">
    <test name="family"><string>Liberation Sans</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Helvetica</string><string>Arial</string><string>Helvetica Neue</string>
    </edit>
    <edit name="fullname" mode="assign"><string>Helvetica</string></edit>
    <edit name="postscriptname" mode="assign"><string>Helvetica</string></edit>
  </match>
  <match target="scan">
    <test name="family"><string>Liberation Serif</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Times</string><string>Times New Roman</string>
    </edit>
    <edit name="fullname" mode="assign"><string>Times Roman</string></edit>
    <edit name="postscriptname" mode="assign"><string>Times-Roman</string></edit>
  </match>
  <match target="scan">
    <test name="family"><string>Liberation Mono</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Menlo</string><string>Courier New</string><string>Monaco</string><string>Courier</string>
    </edit>
    <edit name="fullname" mode="assign"><string>Menlo Regular</string></edit>
    <edit name="postscriptname" mode="assign"><string>Menlo-Regular</string></edit>
  </match>
  <match target="scan">
    <test name="family"><string>Noto Color Emoji</string></test>
    <edit name="family" mode="assign" binding="same"><string>Apple Color Emoji</string></edit>
    <edit name="fullname" mode="assign"><string>Apple Color Emoji</string></edit>
    <edit name="postscriptname" mode="assign"><string>AppleColorEmoji</string></edit>
  </match>
  <match target="scan">
    <test name="family"><string>Noto Sans CJK SC</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>PingFang SC</string><string>Heiti SC</string><string>STHeiti</string><string>Hiragino Sans GB</string>
    </edit>
    <edit name="fullname" mode="assign"><string>PingFang SC</string></edit>
    <edit name="postscriptname" mode="assign"><string>PingFangSC-Regular</string></edit>
  </match>
  <match target="scan">
    <test name="family"><string>Noto Sans CJK TC</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>PingFang TC</string><string>Heiti TC</string>
    </edit>
    <edit name="fullname" mode="assign"><string>PingFang TC</string></edit>
    <edit name="postscriptname" mode="assign"><string>PingFangTC-Regular</string></edit>
  </match>
  <match target="scan">
    <test name="family"><string>Noto Sans CJK HK</string></test>
    <edit name="family" mode="assign" binding="same"><string>PingFang HK</string></edit>
    <edit name="fullname" mode="assign"><string>PingFang HK</string></edit>
    <edit name="postscriptname" mode="assign"><string>PingFangHK-Regular</string></edit>
  </match>
  <match target="scan">
    <test name="family"><string>Noto Sans CJK JP</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Hiragino Sans</string><string>Hiragino Kaku Gothic ProN</string>
    </edit>
    <edit name="fullname" mode="assign"><string>Hiragino Sans</string></edit>
    <edit name="postscriptname" mode="assign"><string>HiraginoSans-W3</string></edit>
  </match>
  <match target="scan">
    <test name="family"><string>Noto Sans CJK KR</string></test>
    <edit name="family" mode="assign" binding="same"><string>Apple SD Gothic Neo</string></edit>
    <edit name="fullname" mode="assign"><string>Apple SD Gothic Neo</string></edit>
    <edit name="postscriptname" mode="assign"><string>AppleSDGothicNeo-Regular</string></edit>
  </match>
  <match target="scan">
    <test name="family"><string>Noto Serif CJK SC</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Songti SC</string><string>STSong</string>
    </edit>
    <edit name="fullname" mode="assign"><string>Songti SC</string></edit>
    <edit name="postscriptname" mode="assign"><string>STSongti-SC-Regular</string></edit>
  </match>
  <match target="scan">
    <test name="family"><string>Noto Serif CJK TC</string></test>
    <edit name="family" mode="assign" binding="same"><string>Songti TC</string></edit>
    <edit name="fullname" mode="assign"><string>Songti TC</string></edit>
    <edit name="postscriptname" mode="assign"><string>STSongti-TC-Regular</string></edit>
  </match>
  <!-- macOS has no Noto Serif CJK HK/JP/KR equivalents worth exposing. -->
  <selectfont>
    <rejectfont>
      <pattern><patelt name="family"><string>Noto Serif CJK HK</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Serif CJK JP</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Serif CJK KR</string></patelt></pattern>
    </rejectfont>
  </selectfont>

  <!-- Generic families resolve like Chrome on macOS (zh-CN). -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Helvetica</family><family>PingFang SC</family><family>Apple Color Emoji</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>Times</family><family>Songti SC</family><family>Apple Color Emoji</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>Courier</family><family>PingFang SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Helvetica Neue</family><family>PingFang SC</family></prefer>
  </alias>
</fontconfig>
